stages:
  - test
  - report

run_ui_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.45.0-jammy
  script:
    - npm ci  
    - npm run test:smoke || true
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 1 day

generate_report:
  stage: report
  image: node:20 
  script:
    - npm install -g allure-commandline
    - allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 7 days
  dependencies:
    - run_ui_tests