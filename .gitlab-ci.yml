stages:
  - test
  - report 

run_ui_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  script:
    - npm ci
    - npx wdio run wdio.conf.ts --cucumberOpts.tagExpression='@smoke'
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 1 day
  allow_failure: false

generate_report:
  stage: report
  image: node:20  
  before_script:
    - apt-get update && apt-get install -y default-jre  
  script:
    - npm install -g allure-commandline --silent
    - allure generate allure-results --clean -o allure-report
    - echo " Report generated! open index.html in the 'allure-report' artifact "
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 7 days
  dependencies:
    - run_ui_tests
  needs:
    - run_ui_tests